<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home IoT Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
      <h1 class="h4">🏠 Smart Home IoT System</h1>
      <span id="status" class="badge bg-secondary">Conectando...</span>
    </header>

    <div class="row g-4">
      <!-- Temperatura -->
      <div class="col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-muted">Temperatura</h5>
            <h2 id="temp" class="display-6">-- °C</h2>
          </div>
        </div>
      </div>

      <!-- Humedad -->
      <div class="col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-muted">Humedad</h5>
            <h2 id="hum" class="display-6">-- %</h2>
          </div>
        </div>
      </div>

      <!-- Control de Luz -->
      <div class="col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-muted">Control de Luz</h5>
            <h2 id="luz-val" class="display-6">0%</h2>
            <input type="range" class="form-range mt-2" id="slider-luz" min="0" max="100" value="0">
          </div>
        </div>
      </div>
    </div>

    <!-- Panel de Alertas -->
    <div class="row mt-4">
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-header bg-dark text-white">
            <h5 class="card-title mb-0">🚨 Registro de Alertas</h5>
          </div>
          <div class="card-body">
            <ul id="alerts-list" class="list-group">
              <li class="list-group-item text-muted">Sin alertas recientes.</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Socket.io CDN -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
